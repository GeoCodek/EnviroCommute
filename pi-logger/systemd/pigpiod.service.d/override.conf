# CRITICAL: run pigpiod with the PWM clock (-t 0) instead of the default PCM clock.
#
# On the Enviro+ the I2S MEMS microphone (dtoverlay=adau7002-simple + dtparam=audio=on)
# uses the PCM peripheral. pigpio's default PCM-based DMA sampling then silently fails:
# bb_serial_read and GPIO callbacks return 0 bytes while plain gpioread still works --
# which looks exactly like a broken solder joint. -t 0 moves pigpio's timing onto PWM
# and fixes both the GPS bit-bang (GPIO16) and the KY-040 encoder.
#
# Install:
#   sudo mkdir -p /etc/systemd/system/pigpiod.service.d
#   sudo cp override.conf /etc/systemd/system/pigpiod.service.d/
#   sudo systemctl daemon-reload && sudo systemctl enable --now pigpiod
[Service]
ExecStart=
ExecStart=/usr/bin/pigpiod -l -t 0
